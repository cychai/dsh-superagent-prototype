name: Sync upstream

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_URL: https://github.com/deepseek-ai/dsh-superagent-prototype.git

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_URL"
          git fetch --prune upstream main
          if git merge-base --is-ancestor upstream/main main; then
            echo "Fork already contains upstream/main."
            exit 0
          fi
          git merge --no-edit --no-ff upstream/main
          git push origin HEAD:main
